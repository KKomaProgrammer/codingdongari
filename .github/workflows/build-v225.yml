name: Build v2.2.5
on:
  push:
    paths:
      - '.github/workflows/build-v225.yml'
      - 'tools/build_v225.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v2.2.4 package
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg /tmp/pkg.zip
          mkdir -p /tmp/pkg
          curl -fL -o /tmp/pkg.zip "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/message_V2.2.4.zip"
          unzip -q /tmp/pkg.zip -d /tmp/pkg
      - name: Patch v2.2.5
        run: python tools/build_v225.py
      - name: Validate v2.2.5 behavior
        run: |
          set -euo pipefail
          find /tmp/pkg -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/pkg')
          m=json.loads((r/'manifest.json').read_text())
          b=json.loads((r/'build-info.json').read_text())
          bg=(r/'background.js').read_text()
          ct=(r/'content/chat.js').read_text()
          assert m['version']=='2.2.5'
          assert b['version']=='2.2.5' and b['buildId']
          assert 'CHANGELOG-v2.2.5.md' in b['managedFiles']
          # membership vs presence
          assert "_0x0172.online = false" in bg
          assert "_0x008c.users.clear()" not in bg
          assert "online: false" in bg
          assert "authoritative: Boolean(_0x0139.isLeader)" in bg
          assert "_0x014f.users.delete(_0x014c.userId)" in bg
          assert "오프라인 · 방에는 참가 중" in ct
          # room recommendation notifications
          assert "realtime:els-chat-global-notify" in bg
          assert "case 'RECOMMEND_ROOM'" in bg
          assert "case 'MARK_NOTIFICATIONS_READ'" in bg
          assert 'notificationBell' in ct and 'notificationDot' in ct
          assert '님이 ${_0x0005(_0x026d.roomName' in ct
          assert '방에 참가하길 추천합니다' in ct
          assert 'data-room-tool="recommend"' in ct
          # persistent scroll
          assert 'entryChatScrollPositionsV2' in ct
          assert "chrome.storage.local.set({ [_0x024a]: _0x0255 })" in ct
          assert "chrome.storage.local.get(_0x024a)" in ct
          assert "if (!_0x01e1 || !_0x0003.open || _0x0011.hidden)" in ct
          assert "nav:rooms" in ct and "nav:room:" in ct
          print('validation ok', b['buildId'])
          PY
      - name: Build ZIP
        run: |
          set -euo pipefail
          cd /tmp/pkg
          zip -qr -9 "$GITHUB_WORKSPACE/message_V2.2.5.zip" .
          unzip -t "$GITHUB_WORKSPACE/message_V2.2.5.zip" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: message_V2.2.5
          path: message_V2.2.5.zip
          if-no-files-found: error
      - name: Commit ZIP
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add message_V2.2.5.zip
          git diff --cached --quiet && exit 0
          git commit -m "release: add message_V2.2.5.zip"
          git push
