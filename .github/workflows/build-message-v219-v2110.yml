name: Build message V2.1.9 and V2.1.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-message-v219-v2110.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          test -f message_V2.1.8.zip
          rm -rf .work-v219 .work-v2110
          mkdir .work-v219
          unzip -q message_V2.1.8.zip -d .work-v219
          cp .build-v219/updater.js .work-v219/updater.js
          cp .build-v219/updater.html .work-v219/updater.html
          python3 - <<'PY'
          import json, pathlib, re, shutil
          root = pathlib.Path('.work-v219')

          # Update the in-chat update explanation.
          p = root / 'content/chat.js'
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(
              r'업데이트를 누르면 전용 업데이트 화면이 열립니다\.[^<]*',
              "업데이트 화면이 열리면 최신 message_Vx.x.x.zip이 기본 다운로드됩니다. 다운로드가 끝나면 ZIP을 압축 해제하지 말고 화면의 ‘ZIP 불러오기’를 눌러 받은 ZIP 파일을 선택하세요. ZIP 내부 검증 후 자동 압축 해제하여 확장 폴더 전체를 갱신합니다.",
              s,
              count=1,
          )
          if n == 0:
              s2 = s.replace(
                  '새 ZIP은 자동 다운로드·압축 해제되며, 이전에 승인한 실제 확장 폴더 쓰기 권한이 유지되고 있으면 폴더 선택 없이 전체 파일과 버전을 자동 갱신한 뒤 확장을 다시 시작합니다.',
                  "최신 ZIP이 기본 다운로드됩니다. 다운로드가 끝나면 ZIP을 압축 해제하지 말고 화면의 ‘ZIP 불러오기’를 눌러 받은 ZIP 파일을 선택하세요. ZIP 내부 검증 후 자동 압축 해제하여 확장 폴더 전체를 갱신합니다."
              )
          s2 = s2.replace("_0x000f('modalConfirm').textContent = '업데이트';", "_0x000f('modalConfirm').textContent = 'ZIP 업데이트';")
          p.write_text(s2, encoding='utf-8')

          mpath = root / 'manifest.json'
          m = json.loads(mpath.read_text(encoding='utf-8'))
          m['version'] = '2.1.9'
          perms = list(m.get('permissions') or [])
          if 'downloads' not in perms:
              perms.append('downloads')
          m['permissions'] = perms
          mpath.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          bpath = root / 'build-info.json'
          b = json.loads(bpath.read_text(encoding='utf-8'))
          b['productId'] = 'junwoo-comprehensive-chat-extension'
          b['version'] = '2.1.9'
          b['buildId'] = '0d1bc2bc-75f0-4a32-a0de-ce122edeb1c2'
          b['createdAt'] = '2026-09-11T03:09:00Z'
          managed = [str(x) for x in b.get('managedFiles', []) if str(x)]
          if 'CHANGELOG-v2.1.9.md' not in managed:
              managed.append('CHANGELOG-v2.1.9.md')
          b['managedFiles'] = managed
          bpath.write_text(json.dumps(b, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'CHANGELOG-v2.1.9.md').write_text('''# Entry Live Studio v2.1.9\n\n- 업데이트 화면을 ZIP 중심 흐름으로 변경했습니다.\n- 새 버전을 찾으면 `message_Vx.x.x.zip`을 기본 다운로드합니다.\n- 다운로드한 ZIP을 `ZIP 불러오기`로 직접 선택할 수 있습니다.\n- 선택한 ZIP의 파일명, manifest 버전, build-info 버전/buildId를 검증한 뒤 자동 압축 해제하여 실제 확장 폴더에 적용합니다.\n- ZIP은 사용자가 직접 압축 해제할 필요가 없습니다.\n- Chrome downloads 권한을 사용하여 업데이트 ZIP 다운로드를 안정적으로 시작합니다.\n''', encoding='utf-8')

          # Build V2.1.10 from exactly the same functional files.
          root10 = pathlib.Path('.work-v2110')
          shutil.copytree(root, root10)
          m10p = root10 / 'manifest.json'
          m10 = json.loads(m10p.read_text(encoding='utf-8'))
          m10['version'] = '2.1.10'
          m10p.write_text(json.dumps(m10, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          b10p = root10 / 'build-info.json'
          b10 = json.loads(b10p.read_text(encoding='utf-8'))
          b10['version'] = '2.1.10'
          b10['buildId'] = '8347a516-5484-4025-81ed-e1216d5a6947'
          b10['createdAt'] = '2026-09-11T03:09:30Z'
          managed10 = [str(x) for x in b10.get('managedFiles', []) if str(x)]
          if 'CHANGELOG-v2.1.10.md' not in managed10:
              managed10.append('CHANGELOG-v2.1.10.md')
          b10['managedFiles'] = managed10
          b10p.write_text(json.dumps(b10, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root10 / 'CHANGELOG-v2.1.10.md').write_text('''# Entry Live Studio v2.1.10\n\n- v2.1.9와 기능이 동일한 업데이트 동작 테스트용 버전입니다.\n- 최신 ZIP 자동 다운로드 → ZIP 불러오기 → 검증 → 자동 압축 해제 → 확장 폴더 적용 흐름을 테스트합니다.\n''', encoding='utf-8')
          PY

          rm -f message_V2.1.9.zip message_V2.1.10.zip
          (cd .work-v219 && zip -qr -9 ../message_V2.1.9.zip .)
          (cd .work-v2110 && zip -qr -9 ../message_V2.1.10.zip .)

          python3 - <<'PY'
          import json, zipfile
          for ver in ('2.1.9', '2.1.10'):
              path = f'message_V{ver}.zip'
              with zipfile.ZipFile(path) as z:
                  m = json.loads(z.read('manifest.json'))
                  b = json.loads(z.read('build-info.json'))
                  h = z.read('updater.html').decode('utf-8')
                  u = z.read('updater.js').decode('utf-8')
                  assert m['version'] == ver
                  assert b['version'] == ver and b['buildId']
                  assert 'downloads' in m.get('permissions', [])
                  assert 'id="loadZip"' in h and 'id="zipFile"' in h
                  assert 'chrome.downloads.download' in u
                  assert 'ZIP 불러오기' in h
                  assert z.testzip() is None
                  print('verified', path, b['buildId'])
          PY

          rm -rf .work-v219 .work-v2110

      - name: Commit packages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add message_V2.1.9.zip message_V2.1.10.zip
          if git diff --cached --quiet; then
            echo 'Packages already current.'
            exit 0
          fi
          git commit -m 'Add message V2.1.9 and V2.1.10 update packages'
          git push origin HEAD:main
