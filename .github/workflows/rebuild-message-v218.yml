name: Rebuild message V2.1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-message-v218.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified update ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f message_V2.1.7.zip
          rm -rf .v218-build
          mkdir .v218-build
          python3 - <<'PY'
          import json, zipfile, pathlib, shutil, datetime, re

          src = pathlib.Path('message_V2.1.7.zip')
          dst = pathlib.Path('.v218-build')
          with zipfile.ZipFile(src, 'r') as z:
              z.extractall(dst)

          manifest_path = dst / 'manifest.json'
          build_path = dst / 'build-info.json'
          if not manifest_path.exists() or not build_path.exists():
              raise SystemExit('manifest.json/build-info.json missing from v2.1.7 package')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          build = json.loads(build_path.read_text(encoding='utf-8'))

          if int(manifest.get('manifest_version', 0)) != 3:
              raise SystemExit('manifest_version must be 3')
          if manifest.get('name') != '이준우가 만든 종합 채팅 확장프로램':
              raise SystemExit('extension name mismatch')

          manifest['version'] = '2.1.8'
          build['productId'] = 'junwoo-comprehensive-chat-extension'
          build['version'] = '2.1.8'
          build['buildId'] = '8e89daff-e61a-4e51-91d4-62a9f5f0a87e'
          build['createdAt'] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          changelog_name = 'CHANGELOG-v2.1.8.md'
          managed = [str(x) for x in build.get('managedFiles', []) if str(x)]
          if changelog_name not in managed:
              managed.append(changelog_name)
          build['managedFiles'] = managed

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          build_path.write_text(json.dumps(build, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (dst / changelog_name).write_text('''# Entry Live Studio v2.1.8\n\n- 업데이트 ZIP의 파일명, manifest.json, build-info.json 버전을 모두 2.1.8로 통일했습니다.\n- productId와 buildId를 기존 updater 검증 규격에 맞게 재생성했습니다.\n- 저장소의 잘못된 v2.1.7 패키지를 건너뛰고 v2.1.8을 최신 업데이트로 사용합니다.\n''', encoding='utf-8')

          updater_path = dst / 'updater.js'
          if updater_path.exists():
              s = updater_path.read_text(encoding='utf-8')
              old = "if (_0x004a?.productId !== _0x0007 || _0x004a?.version !== _0x0041.version || !_0x004a?.buildId) throw new Error('업데이트 빌드 정보가 올바르지 않습니다.');"
              new = "const _0x0093 = String(_0x0041?.version || '').trim(); const _0x0094 = String(_0x004a?.version || '').trim(); const _0x0095 = String(_0x004a?.buildId || '').trim(); if (!_0x0094 || _0x0080(_0x0094, _0x0093) !== 0 || !_0x0095) throw new Error(`업데이트 빌드 정보가 올바르지 않습니다. target=${_0x0093 || '?'}, build=${_0x0094 || '?'}, buildId=${_0x0095 ? '있음' : '없음'}`);"
              if old in s:
                  s = s.replace(old, new)
              updater_path.write_text(s, encoding='utf-8')

          out = pathlib.Path('message_V2.1.8.zip')
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(dst.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(dst).as_posix())

          with zipfile.ZipFile(out, 'r') as z:
              m = json.loads(z.read('manifest.json'))
              b = json.loads(z.read('build-info.json'))
              assert m['version'] == '2.1.8'
              assert b['version'] == '2.1.8'
              assert b['productId'] == 'junwoo-comprehensive-chat-extension'
              assert b['buildId'] == '8e89daff-e61a-4e51-91d4-62a9f5f0a87e'
              assert 'updater.js' in z.namelist()
          print('verified message_V2.1.8.zip')
          PY

          rm -rf .v218-build

      - name: Commit rebuilt ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add message_V2.1.8.zip
          if git diff --cached --quiet; then
            echo 'ZIP already up to date.'
            exit 0
          fi
          git commit -m 'Add verified message V2.1.8 update package'
          git push origin HEAD:main
