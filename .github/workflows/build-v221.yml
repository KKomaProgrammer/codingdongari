name: Build v2.2.1
on:
  push:
    paths:
      - '.github/workflows/build-v221.yml'
      - 'tools/build_v221.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v2.2.0 package
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg /tmp/pkg.zip
          mkdir -p /tmp/pkg
          curl -fL -o /tmp/pkg.zip "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/message_V2.2.0.zip"
          unzip -q /tmp/pkg.zip -d /tmp/pkg
      - name: Patch v2.2.1
        run: python tools/build_v221.py
      - name: Validate JavaScript and metadata
        run: |
          set -euo pipefail
          find /tmp/pkg -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/pkg')
          m=json.loads((r/'manifest.json').read_text())
          b=json.loads((r/'build-info.json').read_text())
          assert m['version']=='2.2.1'
          assert b['version']=='2.2.1' and b['buildId']
          sf=(r/'shared/settings-fetch.js').read_text()
          bg=(r/'background.js').read_text()
          ct=(r/'content/chat.js').read_text()
          up=(r/'updater.js').read_text()
          assert '/current/chat-backup' in sf and 'backupMessages' in sf
          assert 'mandatoryUpdate' in bg and 'ACK_SHORTCUT_INTRO' in bg
          assert '업데이트 필요' in ct and '동의합니다' in ct and 'shortcutIntro' in ct
          assert 'showDirectoryPicker' in up and 'progressBar' in (r/'updater.html').read_text()
          print('validation ok', b['buildId'])
          PY
      - name: Build ZIP
        run: |
          cd /tmp/pkg
          zip -qr -9 "$GITHUB_WORKSPACE/message_V2.2.1.zip" .
          unzip -t "$GITHUB_WORKSPACE/message_V2.2.1.zip" >/dev/null
      - name: Commit ZIP
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add message_V2.2.1.zip
          git diff --cached --quiet && exit 0
          git commit -m "release: add message_V2.2.1.zip"
          git push
